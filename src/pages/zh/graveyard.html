  <h1>墓志铭。</h1>
  <p class="deck">集群判死的每一条路线，都写下死因。判死本身是结果：它说明这一整族论证不可能成立，于是没人再在那里花一个月。每一条都点名一类，不点名“数学”。</p>
</header>

<div class="page-body">
  <div class="grave-list" data-graveyard></div>

  <div class="callout">
    <b>为什么墓地是要交的东西。</b>席位无限的集群只有一个真正的敌人：重走已经死掉的路。点出类、点出具体失败的那一步、写上日期，就把一次失败变成地图上的一道墙——而地图是新席位第一眼读的东西。
  </div>
